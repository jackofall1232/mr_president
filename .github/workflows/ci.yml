name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: php tests/run.php (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
      - name: Run the dependency-free test suite
        run: php tests/run.php
